aid: sellerx
name: SellerX
description: 'SellerX is a Berlin-based consumer-brand builder, founded in 2020, that
  acquires, operates and scales everyday consumer products into omnichannel global
  brands. Originally one of Europe''s largest Amazon FBA aggregators, it merged with
  KW Commerce in 2021 and with the US aggregator Elevate Brands in 2023, and has since
  repositioned itself from an aggregator into a brand builder. The group operates 20+
  brands and 25k+ products across 10+ countries from hubs in Berlin, London, Manila
  and Dongguan, and has raised more than $750M in equity and debt from Sofina, L Catterton,
  Cherry Ventures, Felix Capital, 83North, an ADIA subsidiary, BlackRock and Victory
  Park Capital. SellerX sells consumer goods to consumers through marketplaces and
  its own channels; it publishes no public API, developer portal, SDK or machine-readable
  specification of its own.'
