apis:
- aid: sellerx:mcp
  name: SellerX MCP Server
  description: >-
    A live, remotely hosted Model Context Protocol server operated by SellerX at
    mcp.sellerx.com. The endpoint requires an OAuth 2.1 bearer token, so the tool
    manifest is auth-gated, but the server publishes RFC 8414 authorization-server
    metadata and RFC 9728 protected-resource metadata anonymously, along with a
    dynamic client registration endpoint and mandatory PKCE (S256). SellerX does
    not link to, document, or advertise this server anywhere on its corporate site;
    it was discovered through Certificate Transparency logs for sellerx.com.
  humanURL: https://mcp.sellerx.com/.well-known/oauth-protected-resource/mcp
  baseURL: https://mcp.sellerx.com/mcp
  tags:
