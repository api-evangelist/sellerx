  detail: >-
    SellerX runs a live remote MCP server at https://mcp.sellerx.com/mcp that it
    does not link or document anywhere public — it was found only through
    Certificate Transparency logs for sellerx.com. Its OAuth 2.1 discovery
    metadata (RFC 8414 + RFC 9728) is served anonymously and is captured
    verbatim, but the JSON-RPC tools/list manifest returns 401 invalid_token, so
    the tool set and its input schemas are auth-gated and deliberately not
    recorded. The corporate site publishes no API of any kind and answers HTTP
    200 with an identical SPA body for every path, including nonexistent ones.
  evidence:
