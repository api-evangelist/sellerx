tools:
  status: gated
  note: >-
    NOT ENUMERATED. An anonymous JSON-RPC tools/list POST to
    https://mcp.sellerx.com/mcp returns HTTP 401 invalid_token, so the live tool
    manifest and its inputSchemas require an authenticated introspection we did
    not perform. SellerX publishes no llms.txt, no OpenAPI and no docs page
    listing the tools, so there is no public fallback source. No tool list is
    recorded here because none could be observed — nothing is inferred or
    invented.

