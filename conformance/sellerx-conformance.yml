- id: rfc8414-oauth-authorization-server-metadata
  conforms: true
  evidence: >-
    GET /.well-known/oauth-authorization-server returns 200 application/json with
    issuer, authorization_endpoint, token_endpoint and registration_endpoint.
- id: rfc9728-oauth-protected-resource-metadata
  conforms: true
  evidence: >-
    GET /.well-known/oauth-protected-resource/mcp returns 200 with resource,
    authorization_servers, scopes_supported and bearer_methods_supported; the URL
    is advertised via the WWW-Authenticate resource_metadata parameter on the 401.
- id: rfc7636-pkce
  conforms: true
  evidence: >-
    code_challenge_methods_supported is [S256]; GET /authorize without
    code_challenge returns 400 "code_challenge: Field required".
- id: rfc7591-dynamic-client-registration
  conforms: true
  evidence: >-
    registration_endpoint https://mcp.sellerx.com/register is advertised and
    returns 405 Method Not Allowed on GET, i.e. it accepts POST registration.
    Not exercised — registering would create state on SellerX systems.
- id: rfc6750-bearer-token-usage
  conforms: true
  evidence: >-
    bearer_methods_supported is [header]; the 401 carries a conformant
    WWW-Authenticate Bearer challenge with error="invalid_token".
- id: oauth2.1
  conforms: true
  evidence: >-
    Authorization-code + PKCE S256 mandatory, no implicit or password grants
    advertised — consistent with the OAuth 2.1 profile MCP requires.
- id: mcp-authorization
  conforms: true
  evidence: >-
    Implements the MCP authorization spec: protected-resource metadata pointed at
    from the WWW-Authenticate challenge, OAuth 2.1 AS with dynamic client
    registration.
- id: mcp-streamable-http
  conforms: unknown
  evidence: >-
    POST /mcp is the endpoint and /sse returns 404, which is consistent with
    Streamable HTTP rather than the deprecated HTTP+SSE transport, but the
    transport cannot be confirmed without an authenticated initialize.
- id: openid-connect
  conforms: false
  evidence: /.well-known/openid-configuration returns 404.
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI or Swagger document found on any SellerX host. The corporate site
